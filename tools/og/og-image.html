<!DOCTYPE html>
<!--
  Fonte da imagem de compartilhamento (og-image-N.jpg, 1200×630).
  Para regenerar: python tools/gerar_og.py (veja o README).
  Usa as cores e fontes do tema (base.css) e os números de data/*.json, para não ficar desatualizada.
  Personalize: título, frase e a arte da direita (aqui, uma grade com ícones das conquistas).
-->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/base.css">
<!-- Mesmas fontes das páginas -->
<link href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,700;1,400&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;color:var(--text);font-family:var(--font-body);
    background:radial-gradient(ellipse at 6% 0%,var(--bg-glow-a) 0,transparent 560px),radial-gradient(ellipse at 100% 40%,var(--bg-glow-b) 0,transparent 520px),var(--bg);
    padding:62px 70px}
  .card:after{content:"";position:absolute;inset:18px;border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:6px}
  .brand{display:flex;align-items:center;gap:16px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.09em;text-transform:uppercase}
  .mark{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);transform:rotate(45deg);border-radius:9px}
  .mark span{transform:rotate(-45deg);font-size:20px}
  .eyebrow{margin-top:46px;font-size:19px;max-width:560px}
  h1{margin-top:20px;font-size:74px;line-height:1.04;max-width:640px}
  .sub{margin-top:22px;font-size:27px;color:var(--soft);max-width:600px;line-height:1.3}
  .chips{position:absolute;left:70px;bottom:62px;display:flex;gap:12px}
  .chip{font-size:20px;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 18px}
  .chip b{color:var(--text)}
  .icons{position:absolute;right:64px;top:150px;display:grid;grid-template-columns:repeat(4,88px);gap:14px;transform:rotate(-4deg)}
  .icons img{width:88px;height:88px;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 20px #0007}
  .icons img:nth-child(3n){filter:grayscale(1) brightness(.55)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark"><span id="mark">✦</span></span><span id="brand"></span></div>
  <div class="eyebrow" id="game"></div>
  <h1><span id="count">0</span> conquistas.<br><em>Wololo até o fim.</em></h1>
  <p class="sub">Dica e fonte para cada uma, do jogo base às DLCs, com os atalhos de escaramuça.</p>
  <div class="chips" id="chips"></div>
  <div class="icons" id="icons"></div>
</div>
<script type="module">
  import { GAME, BRAND, BRANDMARK, HAS_ROTA } from '../../assets/js/guia.config.js';
  const $ = id => document.getElementById(id);
  $('brand').textContent = BRAND; $('mark').textContent = BRANDMARK; $('game').textContent = GAME + ' · Guia de conquistas';
  const conq = await fetch('../../data/conquistas.json').then(r => r.json());
  const ids = Object.keys(conq.achievements);
  $('count').textContent = ids.length;
  const missable = ids.filter(id => conq.achievements[id].missable).length;
  const chips = [[ids.length, 'conquistas'], [missable, missable === 1 ? 'perdível' : 'perdíveis']].filter(c => c[1] === 'conquistas' || c[0] > 0);
  chips.push([conq.chapters.length, 'capítulos']);
  if (HAS_ROTA) {
    const rota = await fetch('../../data/rota.json').then(r => r.json()).catch(() => null);
    if (rota) chips.push([rota.stages.reduce((a, s) => a + s.tasks.length, 0), 'tarefas na rota']);
  }
  $('chips').innerHTML = chips.map(([n, t]) => `<span class="chip"><b>${n}</b> ${t}</span>`).join('');
  // Ícones das conquistas mais raras primeiro (as mais "troféu")
  const rare = ids.slice().sort((a, b) => conq.achievements[a].pct - conq.achievements[b].pct).slice(0, 16);
  $('icons').innerHTML = rare.map(id => `<img src="../../assets/achievements/${id.toLowerCase()}.jpg" alt="">`).join('');
</script>
</body>
</html>

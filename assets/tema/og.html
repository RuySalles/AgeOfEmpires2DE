<!DOCTYPE html>
<!--
  Imagem de compartilhamento (og-image-N.jpg, 1200×630), parte do TEMA: desenhe-a com a mesma
  direção de arte das páginas (ela é a "capa" do guia no WhatsApp/Discord).
  TEMA-ESQUELETO — apague esta linha quando a arte existir.
  Gerar: python tools/gerar_og.py. Os números vêm de data/*.json, para não ficar desatualizada.
-->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tema.css">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;max-width:none;padding:0}
  .card{width:1200px;height:630px;padding:70px;display:flex;flex-direction:column;justify-content:center;gap:20px;font:28px/1.3 system-ui,sans-serif}
  h1{font-size:80px;line-height:1}
</style>
</head>
<body>
<div class="card">
  <p id="game"></p>
  <h1><span id="count">0</span> conquistas</h1>
  <p id="numeros"></p>
</div>
<script type="module">
  import { GAME, HAS_ROTA } from '../guia.config.js';
  const $ = id => document.getElementById(id);
  $('game').textContent = GAME + ' · Guia de conquistas';
  const conq = await fetch('../../data/conquistas.json').then(r => r.json());
  const ids = Object.keys(conq.achievements);
  $('count').textContent = ids.length;
  const n = [`${conq.chapters.length} capítulos`];
  const missable = ids.filter(id => conq.achievements[id].missable).length;
  if (missable) n.push(`${missable} ${missable === 1 ? 'perdível' : 'perdíveis'}`);
  if (HAS_ROTA) {
    const rota = await fetch('../../data/rota.json').then(r => r.json()).catch(() => null);
    if (rota) n.push(`${rota.stages.reduce((a, s) => a + s.tasks.length, 0)} tarefas na rota`);
  }
  $('numeros').textContent = n.join(' · ');
</script>
</body>
</html>

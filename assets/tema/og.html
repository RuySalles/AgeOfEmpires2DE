<!DOCTYPE html>
<!--
  Imagem de compartilhamento (og-image-N.jpg, 1200×630) do tema "O Painel da Árvore".
  Gerar: python tools/gerar_og.py. Os números vêm de data/*.json.
-->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tema.css">
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Metamorphous&family=Source+Sans+3:wght@400;600;700&display=block" rel="stylesheet">
<style>
  html,body{width:1200px;height:630px;overflow:hidden;margin:0}
  .card{width:1200px;height:630px;padding:40px 52px}
  .arvore-topo{height:100%;margin:0;padding:28px 34px}
  .recursos{font-size:20px}.recursos i{width:30px;height:30px;font-size:16px}
  h1{margin:22px 0 14px!important;font-size:80px!important}
  .eras{--g-progresso:.36}.era strong{font-size:24px}.era small{font-size:14px}
  .faixa{margin-top:20px}.cena{font-size:14px}.fio{--g-progresso:.36}
</style>
</head>
<body>
<div class="card">
 <section class="arvore-topo">
  <div class="recursos placa">
   <span><i class="r1">⚒</i><b id="count">370</b>&nbsp;conquistas</span><span><i class="r2">▣</i><b id="caps">20</b>&nbsp;edifícios</span>
   <span><i class="r3">◆</i>dica e fonte em cada uma</span><span><i class="r4">⧗</i>do jogo base às DLCs</span>
  </div>
  <h1>A árvore das <em><span id="count2">370</span> conquistas</em></h1>
  <div class="eras">
   <div class="era" data-passada><small>Era das</small><strong>Trevas</strong></div>
   <div class="era" data-atual><small>Era</small><strong>Feudal</strong></div>
   <div class="era"><small>Era dos</small><strong>Castelos</strong></div>
   <div class="era"><small>Era</small><strong>Imperial</strong></div>
  </div>
  <div class="faixa"><span class="faixa-legenda">A tapeçaria da campanha · Age of Empires II: Definitive Edition</span><div class="cenas" id="cenas"></div><div class="fio"><i></i></div></div>
 </section>
</div>
<script type="module">
  const conq = await fetch('../../data/conquistas.json').then(r => r.json());
  const n = Object.keys(conq.achievements).length;
  document.getElementById('count').textContent = n; document.getElementById('count2').textContent = n;
  document.getElementById('caps').textContent = conq.chapters.length;
  const R = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
  document.getElementById('cenas').innerHTML = conq.chapters.map((c, i) =>
    `<span class="cena"${i < 7 ? ' data-bordada style="--g-progresso:1"' : ''}${i === 7 ? ' data-atual style="--g-progresso:.4"' : ''}><span>${R[i] || i + 1}</span></span>`).join('');
</script>
</body>
</html>
